<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3a55"/>
      <stop offset="1" stop-color="#06131d"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f2"/>
      <stop offset="1" stop-color="#7fb3cf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sea)"/>
  <!-- light rays -->
  <path d="M150 0 L220 0 L150 512 L110 512 Z" fill="#ffffff" opacity="0.05"/>
  <path d="M300 0 L350 0 L330 512 L290 512 Z" fill="#ffffff" opacity="0.04"/>
  <!-- tuna silhouette -->
  <g transform="translate(236 258) rotate(-8) scale(0.94)">
    <path d="M-170 0 C-120 -62 -10 -84 80 -52 C120 -38 150 -18 168 0 C150 18 120 38 80 52 C-10 84 -120 62 -170 0 Z" fill="url(#fish)"/>
    <!-- tail -->
    <path d="M160 0 L230 -70 C222 -30 222 30 230 70 Z" fill="#9cc6dc"/>
    <!-- dorsal and anal fins -->
    <path d="M-20 -70 L10 -122 L40 -62 Z" fill="#9cc6dc"/>
    <path d="M10 66 L30 104 L52 60 Z" fill="#9cc6dc"/>
    <!-- finlets -->
    <path d="M70 -52 l10 -14 l6 12 Z M96 -40 l10 -12 l5 11 Z M120 -28 l9 -11 l4 10 Z" fill="#9cc6dc"/>
    <!-- lateral line -->
    <path d="M-120 -8 C-40 -28 60 -26 150 0" stroke="#5f93b0" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- eye and mouth -->
    <circle cx="-128" cy="-12" r="11" fill="#06131d"/>
    <circle cx="-131" cy="-15" r="3.5" fill="#ffffff"/>
    <path d="M-170 0 L-138 10" stroke="#06131d" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- spear shaft -->
  <path d="M36 420 L476 360" stroke="#f3b64a" stroke-width="10" stroke-linecap="round"/>
  <path d="M476 360 L446 346 L452 370 Z" fill="#f3b64a"/>
</svg>
